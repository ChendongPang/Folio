[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "An evidence-backed workspace for researching sources and generating long-form Word documents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "python-docx>=1.2,<2",
  "lxml>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "filelock>=3.16,<4",
  "mcp>=1.26,<2",
  "httpx[socks]>=0.28,<1",
  "jsonschema>=4,<5",
  "playwright>=1.58,<2",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-pptx>=1,<2",
  "Pillow>=11,<13",
  "tiktoken>=0.12,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
folio = "folio.cli:main"

[project.urls]
Repository = "https://github.com/ChendongPang/Folio"
Documentation = "https://github.com/ChendongPang/Folio/blob/main/README.md"
Issues = "https://github.com/ChendongPang/Folio/issues"

[tool.hatch.build]
artifacts = ["src/folio/web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
